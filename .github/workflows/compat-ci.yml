name: 兼容性检查
run-name: 兼容性检查（${{ github.ref_name }}）

on:
  push:
    branches: ["master", "main", "develop"]
    paths:
      - 'backend/**'
      - 'soybean-admin/**'
      - 'docker/**'
      - 'Dockerfile'
      - 'scripts/compat/**'
      - 'docs/compat/**'
      - '.github/workflows/compat-ci.yml'
  pull_request:
    branches: ["master", "main", "develop"]
    paths:
      - 'backend/**'
      - 'soybean-admin/**'
      - 'docker/**'
      - 'Dockerfile'
      - 'scripts/compat/**'
      - 'docs/compat/**'
      - '.github/workflows/compat-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-compat:
    name: 后端兼容性检查
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: 后端测试
        run: go test ./...

      - name: 后端构建
        run: go build -ldflags "-X main.appVersion=compat-ci" -o rustdesk-api-server-pro .

  scripts-compat:
    name: 兼容脚本检查
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 检查 Shell 脚本语法
        run: |
          bash -n scripts/compat/check-rustdesk-release.sh
          bash -n scripts/compat/update-compat-target.sh
          bash -n scripts/compat/smoke-api.sh
          bash -n scripts/compat/extract-api-hints.sh
          bash -n scripts/compat/verify-compat-target.sh

      - name: 校验兼容性清单
        run: jq -e '.client.version and .sysinfo_version and .validated_endpoints' docs/compat/rustdesk-current.json

      - name: 校验清单和 Go 常量
        run: bash scripts/compat/verify-compat-target.sh

  docker-smoke:
    name: Docker 冒烟测试
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 构建 Docker 镜像
        run: docker build --build-arg APP_VERSION=compat-ci -t rustdesk-api-server-pro:compat-ci .

      - name: 准备 CI 安全配置
        run: |
          cp backend/server.yaml compat-ci-server.yaml
          sed -i 's/^signKey:.*/signKey: "compat-ci-random-sign-key-1234567890abcdef"/' compat-ci-server.yaml

      - name: 启动 Docker 容器
        run: |
          docker run -d \
            --name rustdesk-api-compat-ci \
            -p 127.0.0.1:12345:12345 \
            -e ADMIN_USER=test \
            -e ADMIN_PASS=testadmin \
            -v "$PWD/compat-ci-server.yaml:/app/server.yaml:ro" \
            rustdesk-api-server-pro:compat-ci

      - name: 等待 API 就绪
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:12345/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs rustdesk-api-compat-ci || true
          exit 1

      - name: 执行公开接口冒烟测试
        run: bash scripts/compat/smoke-api.sh http://127.0.0.1:12345

      - name: 双版本真实 HTTP 登录和退出回归
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from urllib.error import HTTPError
          from urllib.request import Request, ProxyHandler, build_opener

          opener = build_opener(ProxyHandler({}))
          for version in ("1.4.9", "1.5.0"):
              device = "compat-ci-client-" + version
              def post(path, body, token=""):
                  """仅向运行器回环 API 发送合成凭据，不打印请求或认证响应。"""
                  headers = {"Content-Type": "application/json", "X-RustDesk-Version": version}
                  if token:
                      headers["Authorization"] = "Bearer " + token
                  request = Request("http://127.0.0.1:12345" + path,
                                    data=json.dumps(body).encode(), headers=headers)
                  return opener.open(request, timeout=10)

              with post("/api/login", {"username": "test", "password": "testadmin",
                        "id": device, "uuid": device, "type": "account", "autoLogin": True,
                        "deviceInfo": {"os": "Windows", "type": "desktop", "name": device}}) as response:
                  login = json.load(response)
              token = login.get("access_token")
              assert isinstance(token, str) and token and login.get("type") == "access_token", "ERR-2398 登录格式错误"
              assert login.get("user", {}).get("is_admin") is False, "ERR-2398 客户端登录未降权"
              subprocess.run(["bash", "scripts/compat/smoke-api.sh", "http://127.0.0.1:12345"],
                             env=dict(os.environ, TOKEN=token), check=True, timeout=120)
              with post("/api/logout", {"id": device, "uuid": device}, token) as response:
                  assert response.status == 200, "ERR-2398 退出失败"
              try:
                  with post("/api/currentUser", {"id": device}, token):
                      raise RuntimeError("ERR-2398 已退出令牌仍然有效")
              except HTTPError as error:
                  assert error.code == 401, "ERR-2398 退出后未返回拒绝状态"
                  assert str(json.load(error).get("message", "")).startswith("ERR-"), "ERR-2398 拒绝缺少错误码"
              print("PASS: " + version + " 真实 HTTP 登录、鉴权接口、退出及旧令牌拒绝")
          PY

      - name: 失败时显示容器日志
        if: failure()
        run: docker logs rustdesk-api-compat-ci || true

      - name: 清理隔离测试容器
        if: always()
        run: docker rm -f rustdesk-api-compat-ci >/dev/null 2>&1 || true
