name: 构建 Docker 镜像
run-name: 构建 Docker 镜像（不发布）：${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 构建镜像（不推送）
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: rustdesk-api-server-pro:check
          build-args: |
            APP_VERSION=sha-${{ github.sha }}
            BUILD_TIME=${{ github.event.repository.updated_at }}

      - name: 检查本地镜像
        run: docker image inspect rustdesk-api-server-pro:check >/dev/null
