name: 受控镜像构建验收
run-name: 受控镜像构建验收（${{ github.ref_name }}）

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: controlled-image-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 准备原生 WSS 验收依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl libsodium23
          docker pull alpine:3.20.3

      - name: 协议探针离线自测
        run: |
          python3 -B scripts/deploy/controlled-hbbs-protocol-acceptance.py --self-test
          python3 -B scripts/deploy/controlled-wss-protocol-selftest.py

      - name: 构建受控镜像
        shell: bash
        run: |
          set -euo pipefail
          build_time="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          docker build -f Dockerfile.controlled-server -t rustdesk-controlled-server:check .
          docker build -f Dockerfile.controlled \
            --build-arg RUSTDESK_CONTROLLED_SERVER_IMAGE=rustdesk-controlled-server:check \
            --build-arg APP_VERSION="sha-${GITHUB_SHA}" \
            --build-arg BUILD_TIME="${build_time}" \
            -t rustdesk-controlled-all:check .
          docker build -f Dockerfile.controlled-api \
            --build-arg RUSTDESK_CONTROLLED_IMAGE=rustdesk-controlled-all:check \
            -t rustdesk-controlled-api:check .

      - name: 三容器协议、故障及持久化验收
        shell: bash
        run: |
          sudo env \
            RUSTDESK_API_IMAGE=rustdesk-controlled-api:check \
            RUSTDESK_CONTROLLED_SERVER_IMAGE=rustdesk-controlled-server:check \
            sh scripts/deploy/controlled-three-compose-smoke.sh .
